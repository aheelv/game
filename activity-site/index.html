<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>用友新道大数据实训室 · AI游戏奇遇记：零代码创作实战</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- 背景装饰层 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>
    <div class="bg-orb bg-orb-c"></div>
    <div class="bg-scan"></div>
  </div>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <path d="M24 3 43 13v22L24 45 5 35V13z" fill="none" stroke="url(#brandGrad)" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="4.2" fill="url(#brandGrad)"/>
          <path d="M24 8v10M24 30v10M9 16l9 5M30 27l9 5M39 16l-9 5M18 27l-9 5" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>用友新道</strong>
        <span>AI GAME CREATION LAB</span>
      </div>
    </div>

    <div class="brand-sub">AI游戏奇遇记 · 零代码创作实战</div>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <div class="sidebar-foot">
      <div class="sys-status"><span class="pulse-dot"></span><span id="sysStatusText">系统就绪 · 本地离线可用</span></div>
      <div class="sys-meta">用友新道大数据实训室 · 至学楼D103 · v1.0</div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <div class="content-wrap">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="展开导航">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumb">
        <span class="crumb-root">用友新道大数据实训室</span>
        <span class="crumb-sep">/</span>
        <span id="crumbCurrent">活动总览</span>
      </div>
      <div class="topbar-actions">
        <span class="live-badge"><span class="pulse-dot"></span> LIVE 现场模式</span>
        <button class="icon-btn" id="btnPaper" title="纸质应急模式" aria-label="纸质应急模式">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>
        </button>
        <button class="icon-btn" id="btnMusic" title="轻音乐开关" aria-label="轻音乐开关">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
        </button>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main class="main" id="app" tabindex="-1"></main>

    <footer class="footer">
      <div class="footer-l">用友新道大数据实训室 · AI游戏奇遇记：零代码创作实战</div>
      <div class="footer-c">地点 至学楼D103 · 借助AI工具零代码完成小游戏并现场提交 · 纸质登记与现场大屏双轨一致</div>
      <div class="footer-r">LOCAL-FIRST · NO SERVER REQUIRED</div>
    </footer>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="overlay" id="overlay"></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
<script src="js/modules.js"></script>
</body>
</html>
